<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小票">
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>小票</title>
<style>
  :root {
    --bg: #f4f3ef; --surface: #ffffff; --surface-2: #ebe9e3; --text: #1b1b19; --muted: #77756e; --faint: #a9a79f;
    --line: rgba(27, 27, 25, .09); --accent: #0f766e; --accent-soft: rgba(15, 118, 110, .12); --on-accent: #fff;
    --bad: #c2362b; --good: #15803d; --shadow: 0 1px 2px rgba(27, 27, 25, .05), 0 6px 20px rgba(27, 27, 25, .05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111110; --surface: #1b1b1a; --surface-2: #272725; --text: #f1f0ec; --muted: #9b9990; --faint: #67655e;
      --line: rgba(241, 240, 236, .1); --accent: #2dd4bf; --accent-soft: rgba(45, 212, 191, .14); --on-accent: #06201d;
      --bad: #ff6b5e; --good: #4ade80; --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body {
    margin: 0; color: var(--text); background: var(--bg);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 1440px; margin: 0 auto; padding: 0 16px 20px; }
  .num { font-variant-numeric: tabular-nums; }
  h1 { font-size: 30px; line-height: 1.15; letter-spacing: -.02em; margin: 22px 0 14px; font-weight: 700; }
  h2 { font-size: 13px; font-weight: 600; letter-spacing: .02em; color: var(--muted); margin: 22px 4px 8px; display: flex; justify-content: space-between; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }
  .bad { color: var(--bad); }
  .good { color: var(--good); }

  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  .btn { white-space: nowrap; flex: none; background: var(--accent); color: var(--on-accent); font-weight: 600; padding: 12px 18px; border-radius: 14px; }
  .btn:active { opacity: .85; }
  .btn:disabled { opacity: .45; }
  input[type=text], input[type=password], input[type=date] {
    font: inherit; color: var(--text); width: 100%; padding: 13px 14px; border-radius: 14px; border: 1px solid var(--line);
    background: var(--surface); outline: none; min-width: 0; min-height: 44px;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  /* cards */
  .card { background: var(--surface); border-radius: 18px; padding: 16px; margin: 0 0 10px; box-shadow: var(--shadow); border: 1px solid var(--line); }
  .card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .card .merchant { font-weight: 650; font-size: 17px; overflow-wrap: anywhere; }
  .card .total { font-weight: 700; font-size: 18px; white-space: nowrap; }
  .card .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .items { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); display: grid; gap: 4px; }
  .item { display: flex; justify-content: space-between; gap: 14px; font-size: 14px; color: var(--muted); }
  .item span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .more { color: var(--accent); font-size: 13px; font-weight: 600; margin-top: 4px; text-align: left; }
  .photo { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; color: var(--accent); font-size: 14px; font-weight: 600; }
  .day { display: flex; justify-content: space-between; align-items: baseline; margin: 20px 4px 8px; }
  .day b { font-size: 15px; }
  .day span { color: var(--muted); font-size: 13px; }

  /* upload */
  .pick {
    display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 38px 16px; border-radius: 22px;
    background: var(--surface); border: 1.5px dashed var(--faint); text-align: center; cursor: pointer;
  }
  .pick:active { background: var(--surface-2); }
  .pick .ic { width: 54px; height: 54px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
  .pick svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .pick strong { font-size: 18px; }
  input[type=file] { display: none; }
  .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); display: inline-block; animation: sp .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .datefix { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .datefix label { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .datefix input { padding: 8px 10px; }

  /* conversation */
  .chatbar { padding: 12px 0 0; border-top: 1px solid var(--line); margin-top: 14px; }
  .chatbar .inner { display: flex; gap: 8px; }
  #q { flex: 1; }
  #go { min-width: 68px; }
  #go.stopping { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
  #chatLog { display: grid; gap: 14px; }
  .bubble { padding: 11px 14px; border-radius: 18px; max-width: 88%; overflow-wrap: anywhere; white-space: pre-wrap; }
  .bubble.me { justify-self: end; background: var(--accent-soft); border-bottom-right-radius: 6px; }
  .bubble.ai { background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; box-shadow: var(--shadow); }
  .scope { margin: 6px 4px 0; font-size: 12px; color: var(--faint); }
  .reply { display: grid; gap: 10px; }
  .reply .card { margin: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .chip { padding: 8px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  .hint { margin: 14px 4px; font-size: 13px; color: var(--muted); }

  /* browse */
  .months { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 10px; scrollbar-width: none; }
  .months::-webkit-scrollbar { display: none; }
  .months button { flex: none; padding: 9px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; font-weight: 600; color: var(--muted); }
  .months button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .months small { opacity: .7; font-weight: 500; margin-left: 4px; }
  .summary { display: flex; justify-content: space-between; align-items: baseline; margin: 4px 4px 10px; }
  .summary b { font-size: 20px; }
  .cal { background: var(--surface); border-radius: 18px; padding: 12px; border: 1px solid var(--line); box-shadow: var(--shadow); margin-bottom: 6px; }
  .cal .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .cal .wd { font-size: 11px; color: var(--faint); padding: 4px 0; }
  .cal button { aspect-ratio: 1; border-radius: 12px; font-size: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--faint); }
  .cal button.has { color: var(--text); font-weight: 600; }
  .cal button.has::after { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
  .cal button.sel { background: var(--accent); color: var(--on-accent); }
  .cal button.sel::after { background: var(--on-accent); }
  .cal button.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .tools { display: flex; gap: 8px; align-items: center; margin: 0 0 6px; }
  .tools .pill { display: flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; font-weight: 600; }
  .tools .pill.on { color: var(--accent); }
  .tools input[type=text] { padding: 8px 12px; width: auto; flex: 1; border-radius: 999px; font-size: 14px; }
  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }

  /* lightbox */
  #lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .92); display: grid; place-items: center; padding: 16px; overflow: auto; }
  #lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
  #lightbox button { position: fixed; top: calc(12px + env(safe-area-inset-top)); right: 14px; width: 38px; height: 38px; border-radius: 50%; background: rgba(255, 255, 255, .18); color: #fff; font-size: 20px; }

  /* login */
  .login { max-width: 420px; margin: auto; padding-top: 14vh; text-align: center; }
  .login .logo { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 18px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
  .login svg { width: 34px; height: 34px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .login .row { display: flex; gap: 8px; margin-top: 18px; }
  .app-head { display: flex; align-items: center; gap: 12px; padding: 22px 4px; }
  .app-head h1 { margin: 0; font-size: 25px; flex: 1; }
  .badge { font-size: 13px; color: var(--accent); background: var(--accent-soft); padding: 6px 10px; border-radius: 999px; white-space: nowrap; }
  .quiet { color: var(--accent); font-size: 14px; min-height: 44px; padding: 0 8px; }
  .workspace { display: grid; gap: 14px; align-items: start; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; min-width: 0; box-shadow: var(--shadow); }
  .panel-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .panel-head h2 { font-size: 17px; color: var(--text); margin: 0; flex: 1; }
  .panel-head .mark { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-size: 19px; }
  .panel-head .quiet { font-size: 13px; }
  .pick { padding: 18px 12px; border-radius: 14px; gap: 5px; }
  .pick strong { font-size: 16px; }
  .pick .ic { width: 38px; height: 38px; }
  .pick svg { width: 22px; height: 22px; }
  .pick span.muted { font-size: 12px; }
  #uploads { display: grid; gap: 8px; margin-top: 12px; max-height: 240px; overflow: auto; }
  #uploads:empty { display: none; }
  #uploads .card { margin: 0; padding: 12px; box-shadow: none; }
  #browseList { max-height: 54dvh; overflow: auto; overscroll-behavior: contain; padding: 0 1px; }
  #chatScroll { max-height: 48dvh; min-height: 100px; overflow: auto; overscroll-behavior: contain; padding: 1px; }
  .months { margin: 0 -6px; padding: 2px 6px 12px; }
  .tools { flex-wrap: wrap; margin-bottom: 12px; }
  .tools input[type=text] { flex: 1; width: 110px; font-size: 16px; }
  .tools form { display: flex; flex: 1; gap: 4px; }
  .cal { box-shadow: none; margin-bottom: 12px; }
  .cal .grid button { min-height: 32px; aspect-ratio: auto; padding: 5px; }
  .summary { gap: 8px; flex-wrap: wrap; margin: 8px 0 12px; }
  .summary b { font-size: 17px; }
  .card .actions { display: flex; align-items: center; gap: 6px; margin: 10px -5px -6px; }
  .card .actions button { min-height: 44px; font-size: 13px; padding: 0 7px; color: var(--accent); }
  .card .actions .delete { color: var(--muted); margin-left: auto; }
  .card .actions button:hover { background: var(--accent-soft); border-radius: 8px; }
  .receipt-date { font-variant-numeric: tabular-nums; }
  .hint { margin: 12px 0 0; font-size: 12px; }
  .chat-note { margin: 0 0 10px; font-size: 13px; color: var(--muted); }
  #notice { margin: 0 0 12px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 14px; }
  button:disabled { cursor: default; opacity: .45; }
  dialog { width: min(420px, calc(100% - 32px)); color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 22px; box-shadow: 0 20px 80px #0003; }
  dialog::backdrop { background: #0007; backdrop-filter: blur(3px); }
  dialog h2 { font-size: 20px; color: var(--text); margin: 0 0 8px; }
  dialog p { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
  dialog label { display: block; font-size: 14px; margin-bottom: 8px; }
  .date-entry { display: grid; gap: 10px; }
  .date-entry input { width: 100%; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
  .dialog-actions .cancel { background: var(--surface-2); color: var(--text); }
  .dialog-actions .danger { background: var(--bad); color: #fff; }
  @media (min-width: 1000px) {
    .workspace { grid-template-columns: 248px minmax(340px,1fr) minmax(300px,360px); align-items: stretch; height: calc(100dvh - 112px); min-height: 550px; }
    .panel { display: flex; flex-direction: column; min-height: 0; }
    #browseList { flex: 1; max-height: none; }
    #chatScroll { flex: 1; max-height: none; }
    #paneChat { grid-column: 3; grid-row: 1; }
    #paneBrowse { grid-column: 2; grid-row: 1; }
    #uploads { max-height: none; }
  }
  @media (max-width: 380px) {
    main { padding-left: 10px; padding-right: 10px; }
    .app-head { gap: 4px; }
    .app-head h1 { font-size: 22px; }
    .panel { padding: 13px; }
    .badge { padding: 5px 7px; }
  }
</style>
</head>
<body>
<main>
  <section id="login" class="login hidden">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></div>
    <h1>小票</h1>
    <p class="muted">第一次使用，请输入口令。<br>之后这台设备会记住。</p>
    <div class="row">
      <input id="pass" type="password" placeholder="口令" autocomplete="current-password">
      <button class="btn" id="enter">进入</button>
    </div>
    <p id="loginError" class="bad"></p>
  </section>

  <section id="app" class="hidden">
    <header class="app-head">
      <h1>小票工作台</h1>
      <span id="libraryCount" class="badge num">小票库</span>
      <button id="refresh" class="quiet" type="button">刷新</button>
    </header>
    <div id="notice" class="hidden" role="status" aria-live="polite"></div>
    <div class="workspace">
      <section id="paneUpload" class="panel" aria-labelledby="uploadTitle">
        <div class="panel-head"><span class="mark" aria-hidden="true">↓</span><h2 id="uploadTitle">归档</h2></div>
        <label class="pick" for="file">
          <span class="ic"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
          <strong>拍照或选择照片</strong>
          <span class="muted">支持多张，自动识别日期、商家和商品</span>
        </label>
        <input id="file" type="file" accept="image/*" multiple>
        <div id="uploads" aria-live="polite"></div>
        <p class="hint">照片将在 Mac 下次同步时归档为 PDF。</p>
      </section>
      <section id="paneBrowse" class="panel" aria-labelledby="browseTitle">
        <div class="panel-head"><span class="mark" aria-hidden="true">▦</span><h2 id="browseTitle">小票库</h2></div>
        <div id="months" class="months" aria-label="月份"></div>
        <div class="tools">
          <button class="pill" id="calToggle" type="button" aria-expanded="false" aria-controls="cal">日历</button>
          <form id="jumpForm"><input id="jump" type="text" inputmode="numeric" placeholder="跳到日期，如 10-8" aria-label="跳到日期" autocomplete="off"><button class="quiet" type="submit">查找</button></form>
        </div>
        <div id="cal" class="cal hidden"></div>
        <div id="browseSummary" class="summary"></div>
        <div id="browseList" aria-busy="false"></div>
      </section>
      <section id="paneChat" class="panel" aria-labelledby="chatTitle">
        <div class="panel-head"><span class="mark" aria-hidden="true">↳</span><h2 id="chatTitle">小票对话</h2><button class="quiet" id="newChat" type="button" disabled>新对话</button></div>
        <div id="chatScroll">
          <div id="chatEmpty">
            <p class="chat-note">查询商家、商品和消费记录。</p>
            <div class="chips"><button class="chip" data-question="上次去 Costco 买了什么？">上次去 Costco 买了什么？</button><button class="chip" data-question="最近一周花了多少钱？">最近一周花了多少钱？</button></div>
            <div id="historyBox"><p class="hint">最近问过</p><div id="history" class="chips"></div></div>
          </div>
          <div id="chatLog" role="log" aria-live="polite" aria-relevant="additions text"></div>
        </div>
        <div class="chatbar"><form id="chatForm" class="inner">
          <input id="q" type="text" placeholder="问小票，或直接说哪里认错了" aria-label="小票问题" enterkeyhint="send" autocomplete="off" maxlength="500">
          <button class="btn" id="go" type="submit" disabled>发送</button>
        </form></div>
      </section>
    </div>
  </section>
</main>

<dialog id="dateDialog" aria-labelledby="dateTitle"><form id="dateForm" novalidate>
  <h2 id="dateTitle">修改小票日期</h2><p id="dateMerchant"></p>
  <label for="receiptDate">消费日期</label>
  <div class="date-entry"><input id="receiptDate" type="text" inputmode="numeric" placeholder="YYYY-MM-DD" autocomplete="off" required><input id="receiptCalendar" type="date" aria-label="选择日期"></div>
  <p>支持 2026-10-08、20261008、10-8。</p><p id="dateError" class="bad" role="alert"></p>
  <p>只更新项目库，不修改 PDF 源文件。</p>
  <div class="dialog-actions"><button type="button" class="btn cancel" id="dateCancel">取消</button><button type="submit" class="btn" id="dateSave">保存日期</button></div>
</form></dialog>
<dialog id="deleteDialog" aria-labelledby="deleteTitle"><form id="deleteForm">
  <h2 id="deleteTitle">从项目库删除？</h2><p id="deleteMerchant"></p><p>只删除这张小票的库内记录。同页其他小票、电脑上的 PDF 源文件都会保留。</p><p id="deleteError" class="bad" role="alert"></p>
  <div class="dialog-actions"><button type="button" class="btn cancel" id="deleteCancel">取消</button><button type="submit" class="btn danger" id="deleteSave">删除小票</button></div>
</form></dialog>
<div id="lightbox" class="hidden"><img alt="小票原件"><button aria-label="关闭">✕</button></div>

<script>
// Public function endpoint; passcode and API keys are never embedded in the page.
const API = "https://orvuihiojdplciilktvm.supabase.co/functions/v1/api";
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v) { try { localStorage.setItem(k,v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
let passcode = store.get("passcode") || "";
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k.startsWith("on")) n[k] = v; else n.setAttribute(k,v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) n.append(k);
  return n;
};
async function call(body, { signal } = {}) {
  let res;
  try {
    res = await fetch(API, { method: "POST", headers: { "content-type":"application/json", "x-passcode":passcode }, body: JSON.stringify(body), signal });
  } catch (err) {
    if (signal?.aborted || err.name === "AbortError") throw err;
    throw new Error("网络不通，请稍后重试");
  }
  const json = await res.json().catch(() => ({}));
  signal?.throwIfAborted();
  if (res.status === 401) {
    stopChat(); store.del("passcode"); passcode = ""; show();
    throw new Error(json.error || "口令不对");
  }
  if (!res.ok) throw new Error(json.error || `出错了（${res.status}）`);
  return json;
}
const fmt = new Intl.NumberFormat("en-US", { minimumFractionDigits:2, maximumFractionDigits:2 });
const SYM = { USD:"$", CNY:"¥", RMB:"¥", EUR:"€", GBP:"£" };
const money = (n,c) => (SYM[(c || "USD").toUpperCase()] ?? c + " ") + fmt.format(n);
const moneyOf = (r) => Number(r.total) > 0 ? money(Number(r.total),r.currency) : "";
const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const WD = ["日","一","二","三","四","五","六"];
function parseDate(text) {
  let t = text.trim().replace(/年|月|\/|\./g,"-").replace(/日|号/g,"");
  if (/^\d{8}$/.test(t)) t = `${t.slice(0,4)}-${t.slice(4,6)}-${t.slice(6)}`;
  const short = /^(\d{1,2})-(\d{1,2})$/.exec(t);
  if (short) {
    let y = new Date().getFullYear();
    const candidate = `${y}-${short[1].padStart(2,"0")}-${short[2].padStart(2,"0")}`;
    if (candidate > ymd(new Date())) y--;
    t = `${y}-${short[1]}-${short[2]}`;
  }
  const parts = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(t);
  if (!parts || Number(parts[1]) === 0) return null;
  const iso = `${parts[1]}-${parts[2].padStart(2,"0")}-${parts[3].padStart(2,"0")}`;
  const date = new Date(iso + "T00:00:00Z");
  return !isNaN(date) && date.toISOString().slice(0,10) === iso ? iso : null;
}
function dayTitle(date) {
  const [y,m,d] = date.split("-").map(Number);
  return `${y === new Date().getFullYear() ? "" : y + "年"}${m}月${d}日 周${WD[new Date(y,m-1,d).getDay()]}`;
}
const monthTitle = (m) => `${m.slice(0,4)}年${Number(m.slice(5))}月`;
function notice(text, bad = false) {
  $("notice").textContent = text;
  $("notice").classList.toggle("bad",bad);
  $("notice").classList.remove("hidden");
}
function show() {
  $("login").classList.toggle("hidden",!!passcode);
  $("app").classList.toggle("hidden",!passcode);
}
$("enter").onclick = async () => {
  const candidate = $("pass").value.trim();
  if (!candidate) return;
  passcode = candidate; $("enter").disabled = true; $("loginError").textContent = "";
  try {
    await call({ action:"ping" }); store.set("passcode",passcode); $("pass").value = "";
    show(); await openBrowse();
  } catch (e) { passcode = ""; show(); $("loginError").textContent = e.message; }
  finally { $("enter").disabled = false; }
};
$("pass").addEventListener("keydown",e => { if (e.key === "Enter" && !e.isComposing) $("enter").click(); });
function lightbox(src) { $("lightbox").querySelector("img").src = src; $("lightbox").classList.remove("hidden"); }
$("lightbox").onclick = () => $("lightbox").classList.add("hidden");

/* Receipt cards */
function itemsBlock(r) {
  if (!r.items?.length) return null;
  const box = el("div",{ class:"items" });
  const draw = (all) => {
    box.replaceChildren(...(all ? r.items : r.items.slice(0,5)).map(i => el("div",{ class:"item" },
      el("span",{},Number(i.quantity)>1 ? `${i.name} ×${Number(i.quantity)}` : i.name),
      el("span",{ class:"num" },Number(i.price)>0 ? money(Number(i.price),r.currency) : ""))));
    if (!all && r.items.length>5) box.append(el("button",{ class:"more",onclick:()=>draw(true) },`另外 ${r.items.length-5} 项…`));
  };
  draw(false); return box;
}
function card(r,{ editable = false } = {}) {
  const node = el("div",{ class:"card receipt-card","data-receipt-id":r.id },
    el("div",{ class:"top" },el("div",{},el("div",{ class:"merchant" },r.merchant || "未识别商家"),
      el("div",{ class:"sub receipt-date" },r.date)),el("div",{ class:"total num" },moneyOf(r))),itemsBlock(r));
  const actions = el("div",{ class:"actions" });
  if (r.view_url) actions.append(el("button",{ onclick:()=>lightbox(r.view_url) },"查看原件"));
  if (editable) actions.append(el("button",{ onclick:()=>editDate(r),"aria-label":`修改 ${r.merchant || "小票"} 的日期` },"修改日期"),
    el("button",{ class:"delete",onclick:()=>confirmDelete(r),"aria-label":`从项目库删除 ${r.merchant || "小票"}` },"删除"));
  if (actions.childNodes.length) node.append(actions);
  return node;
}
function dayGroups(list,withHeader = true) {
  const nodes = []; let date;
  for (const r of list) {
    if (withHeader && r.date !== date) nodes.push(el("div",{ class:"day" },el("b",{},dayTitle(r.date))));
    date = r.date; nodes.push(card(r,{ editable:true }));
  }
  return nodes;
}

/* Receipt management */
let editing = null, deleting = null, savingDate = false, deletingReceipt = false;
function editDate(r) {
  editing = r; $("dateMerchant").textContent = r.merchant || "未识别商家";
  $("receiptDate").value = r.date; $("receiptCalendar").value = r.date; $("dateError").textContent = "";
  $("dateDialog").showModal(); $("receiptDate").focus(); $("receiptDate").select();
}
$("receiptDate").oninput = () => {
  $("dateError").textContent = "";
  const date = parseDate($("receiptDate").value);
  if (date) $("receiptCalendar").value = date;
};
$("receiptCalendar").onchange = () => {
  if (parseDate($("receiptCalendar").value)) $("receiptDate").value = $("receiptCalendar").value;
  $("dateError").textContent = "";
};
$("dateCancel").onclick = () => { if (!savingDate) $("dateDialog").close(); };
$("dateDialog").addEventListener("cancel",e => { if (savingDate) e.preventDefault(); });
$("dateForm").onsubmit = async e => {
  e.preventDefault(); if (!editing || savingDate) return;
  const date = parseDate($("receiptDate").value);
  if (!date) { $("dateError").textContent = "请输入有效日期，例如 2026-10-08"; return; }
  const r = editing;
  savingDate = true; $("dateSave").disabled = true; $("dateCancel").disabled = true;
  try {
    await call({ action:"edit_receipt",id:r.id,date });
    r.date = date;
    document.querySelectorAll(".receipt-card").forEach(n => {
      if (n.dataset.receiptId === r.id) n.querySelector(".receipt-date").textContent = date;
    });
    $("dateDialog").close(); notice("小票日期已更新");
    await refreshLibrary({ day:date });
  } catch (err) { $("dateError").textContent = err.message; }
  finally { savingDate = false; $("dateSave").disabled = false; $("dateCancel").disabled = false; }
};
function confirmDelete(r) {
  deleting = r; $("deleteMerchant").textContent = `${r.merchant || "未识别商家"} · ${r.date}`;
  $("deleteError").textContent = ""; $("deleteDialog").showModal(); $("deleteCancel").focus();
}
$("deleteCancel").onclick = () => { if (!deletingReceipt) $("deleteDialog").close(); };
$("deleteDialog").addEventListener("cancel",e => { if (deletingReceipt) e.preventDefault(); });
$("deleteForm").onsubmit = async e => {
  e.preventDefault(); if (!deleting || deletingReceipt) return;
  const r = deleting;
  deletingReceipt = true; $("deleteSave").disabled = true; $("deleteCancel").disabled = true;
  try {
    await call({ action:"delete_receipt",id:r.id });
    document.querySelectorAll(".receipt-card").forEach(n => { if (n.dataset.receiptId === r.id) n.remove(); });
    $("deleteDialog").close(); notice("已从项目库删除，PDF 源文件已保留");
    await refreshLibrary();
  } catch (err) { $("deleteError").textContent = err.message; }
  finally { deletingReceipt = false; $("deleteSave").disabled = false; $("deleteCancel").disabled = false; }
};

/* Chat cancellation also guards against responses that arrive after the next question. */
let turns = [], activeChat = null;
const loadHistory = () => { try { const v=JSON.parse(store.get("history") || "[]"); return Array.isArray(v) ? v.filter(x=>typeof x === "string").slice(0,10) : []; } catch { return []; } };
function drawHistory() {
  const list = loadHistory(); $("historyBox").classList.toggle("hidden",!list.length);
  $("history").replaceChildren(...list.map(q=>el("button",{ class:"chip",onclick:()=>ask(q) },q)));
}
function remember(q) { store.set("history",JSON.stringify([q,...loadHistory().filter(h=>h!==q)].slice(0,10))); drawHistory(); }
function toEnd() { $("chatScroll").scrollTo({ top:$("chatScroll").scrollHeight,behavior:"smooth" }); }
function setChatBusy() {
  const busy = !!activeChat;
  $("go").textContent = busy ? "停止" : "发送"; $("go").classList.toggle("stopping",busy);
  $("go").setAttribute("aria-label",busy ? "停止回答" : "发送问题");
  $("go").disabled = !busy && !$("q").value.trim();
  $("newChat").disabled = busy || !$("chatLog").childNodes.length;
}
function replyBlock(r) {
  const box = el("div",{ class:"reply" },el("div",{ class:"bubble ai" },r.answer));
  if (r.scope) box.append(el("div",{ class:"scope" },r.scope));
  const list = r.results || [];
  const draw = (all) => {
    box.querySelectorAll(".card,.more").forEach(n=>n.remove());
    for (const x of all ? list : list.slice(0,5)) box.append(card(x));
    if (!all && list.length>5) box.append(el("button",{ class:"more",onclick:()=>draw(true) },`显示全部 ${list.length} 张`));
  };
  draw(false); return box;
}
async function ask(text) {
  const q = (text ?? $("q").value).trim();
  if (!q || activeChat) return;
  if (q.length>500) { notice("问题不能超过 500 个字",true); return; }
  const request = { controller:new AbortController(),wait:el("div",{ class:"bubble ai muted" },el("span",{ class:"spin" }),"正在翻小票…") };
  activeChat = request; $("q").value = ""; $("chatEmpty").classList.add("hidden");
  $("chatLog").append(el("div",{ class:"bubble me" },q),request.wait); setChatBusy(); toEnd();
  try {
    const r = await call({ action:"chat",q,history:turns.slice() },{ signal:request.controller.signal });
    if (activeChat !== request || request.controller.signal.aborted) return;
    request.wait.replaceWith(replyBlock(r)); turns = [...turns,{ q,a:r.answer }].slice(-6);
    if (r.onTopic) remember(q);
  } catch (err) {
    if (activeChat !== request || request.controller.signal.aborted) return;
    request.wait.className = "bubble ai bad"; request.wait.replaceChildren(err.message);
  } finally {
    if (activeChat === request) { activeChat = null; setChatBusy(); toEnd(); }
  }
}
function stopChat() {
  const request = activeChat; if (!request) return;
  activeChat = null; request.controller.abort();
  request.wait.className = "bubble ai muted"; request.wait.replaceChildren("已停止");
  setChatBusy(); toEnd();
}
$("chatForm").onsubmit = e => { e.preventDefault(); if (activeChat) stopChat(); else ask(); };
$("q").addEventListener("keydown",e => {
  if (e.key === "Enter" && (e.isComposing || activeChat)) e.preventDefault();
});
$("q").oninput = setChatBusy;
$("newChat").onclick = () => {
  if (activeChat) return;
  turns = []; $("chatLog").replaceChildren(); $("chatEmpty").classList.remove("hidden"); setChatBusy();
};
document.querySelectorAll("[data-question]").forEach(b=>b.onclick=()=>ask(b.dataset.question));
document.addEventListener("keydown",e => {
  if (e.key === "Escape" && activeChat && !document.querySelector("dialog[open]")) { e.preventDefault(); stopChat(); }
});

/* Browsing: request generations prevent a slow old month from overwriting a new selection. */
let months = null, cache = {}, selMonth = null, selDay = null, calOpen = false, browseEpoch = 0, libraryVersion = 0;
async function openBrowse() {
  const epoch = ++browseEpoch, version = libraryVersion;
  $("browseList").setAttribute("aria-busy","true");
  $("browseList").replaceChildren(el("div",{ class:"empty" },el("span",{ class:"spin" }),"加载中…"));
  try {
    const r = await call({ action:"months" });
    if (epoch !== browseEpoch || version !== libraryVersion || !passcode) return;
    months = r.months || [];
    $("libraryCount").textContent = `${months.reduce((n,m)=>n+m.count,0)} 张小票`;
    selMonth ||= months[0]?.month || ymd(new Date()).slice(0,7);
    await pickMonth(selMonth,selDay);
  } catch (err) {
    if (epoch === browseEpoch) {
      $("browseList").replaceChildren(el("p",{ class:"bad" },err.message));
      $("browseList").setAttribute("aria-busy","false");
    }
  }
}
async function refreshLibrary({ day } = {}) {
  libraryVersion++; browseEpoch++; cache = {}; months = null;
  if (day) { selMonth = day.slice(0,7); selDay = day; }
  await openBrowse();
}
async function pickMonth(month,day = null) {
  const epoch = ++browseEpoch, version = libraryVersion;
  selMonth = month; selDay = day; drawMonths(); drawCalendar();
  $("browseList").setAttribute("aria-busy","true");
  if (!cache[month]) {
    $("browseList").replaceChildren(el("div",{ class:"empty" },el("span",{ class:"spin" }),"加载中…"));
    try {
      const r = await call({ action:"list",month });
      if (version !== libraryVersion) return;
      cache[month] = r.results || [];
    } catch (err) {
      if (epoch === browseEpoch) {
        $("browseList").replaceChildren(el("p",{ class:"bad" },err.message));
        $("browseList").setAttribute("aria-busy","false");
      }
      return;
    }
  }
  if (epoch !== browseEpoch || !passcode) return;
  drawList(); drawCalendar(); $("browseList").setAttribute("aria-busy","false");
}
function drawMonths() {
  const list = (months || []).slice();
  if (selMonth && !list.some(m=>m.month === selMonth)) list.push({ month:selMonth,count:0 });
  list.sort((a,b)=>b.month.localeCompare(a.month));
  $("months").replaceChildren(...list.map(m=>el("button",{ class:m.month === selMonth ? "on" : "",onclick:()=>pickMonth(m.month) },monthTitle(m.month),el("small",{ class:"num" },String(m.count)))));
}
function drawList() {
  const all = cache[selMonth] || [];
  const list = selDay ? all.filter(r=>r.date === selDay) : all;
  $("browseSummary").replaceChildren(el("b",{},selDay ? dayTitle(selDay) : monthTitle(selMonth)),el("span",{ class:"muted num" },`${list.length} 张`));
  if (selDay) $("browseSummary").append(el("button",{ class:"more",onclick:()=>pickMonth(selMonth) },"整月"));
  $("browseList").replaceChildren(...(list.length ? dayGroups(list,!selDay) : [el("div",{ class:"empty" },selDay ? "这一天没有小票" : "这个月没有小票")]));
}
function drawCalendar() {
  $("calToggle").classList.toggle("on",calOpen); $("calToggle").setAttribute("aria-expanded",String(calOpen));
  $("cal").classList.toggle("hidden",!calOpen); if (!calOpen || !selMonth) return;
  const [y,m] = selMonth.split("-").map(Number), first = new Date(y,m-1,1).getDay(), count = new Date(y,m,0).getDate();
  const has = new Set((cache[selMonth] || []).map(r=>Number(r.date.slice(8)))), today = ymd(new Date());
  const cells = WD.map(w=>el("div",{ class:"wd" },w));
  for (let i=0;i<first;i++) cells.push(el("div"));
  for (let d=1;d<=count;d++) {
    const key = `${selMonth}-${String(d).padStart(2,"0")}`;
    cells.push(el("button",{ class:[has.has(d)?"has":"",key===selDay?"sel":"",key===today?"today":""].join(" "),"aria-label":key,onclick:()=>pickMonth(selMonth,key) },String(d)));
  }
  $("cal").replaceChildren(el("div",{ class:"grid" },...cells));
}
$("calToggle").onclick = () => { calOpen = !calOpen; drawCalendar(); };
$("jumpForm").onsubmit = async e => {
  e.preventDefault(); const day = parseDate($("jump").value);
  if (!day) { notice("请输入有效日期，例如 2026-10-08",true); return; }
  calOpen = true; await pickMonth(day.slice(0,7),day); $("jump").value = "";
};
$("refresh").onclick = () => { $("notice").classList.add("hidden"); refreshLibrary(); };
async function prepare(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
  const scale = Math.min(1, 2576 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85));
  const buf = new Uint8Array(await blob.arrayBuffer());
  let bin = ""; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode(...buf.subarray(i, i + 0x8000));
  return btoa(bin);
}
$("file").onchange = async e => {
  const files = [...e.target.files]; e.target.value = "";
  for (const file of files) {
    const box = el("div",{ class:"card" },el("span",{ class:"muted" },el("span",{ class:"spin" }),"识别中…"));
    $("uploads").prepend(box);
    try {
      const image = await prepare(file);
      const r = await call({ action:"upload",image,fallbackDate:ymd(new Date(file.lastModified || Date.now())) });
      if (!r.ok) { box.replaceChildren(el("div",{},r.note || "没有识别到小票")); continue; }
      box.replaceChildren(el("div",{ class:"good" },"已上传"),el("div",{ class:"sub" },(r.receipts || []).map(x=>x.merchant).filter(Boolean).join("、") || "小票"),
        el("button",{ class:"more",onclick:()=>pickMonth(r.date.slice(0,7),r.date) },`查看 ${r.date} 的小票`));
      await refreshLibrary({ day:r.date });
    } catch (err) { box.replaceChildren(el("span",{ class:"bad" },err.message)); }
  }
};
drawHistory(); show(); if (passcode) openBrowse();

</script>
