<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小票">
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>小票</title>
<style>
  :root {
    --bg: #f4f3ef; --surface: #ffffff; --surface-2: #ebe9e3; --text: #1b1b19; --muted: #77756e; --faint: #a9a79f;
    --line: rgba(27, 27, 25, .09); --accent: #0f766e; --accent-soft: rgba(15, 118, 110, .12); --on-accent: #fff;
    --bad: #c2362b; --good: #15803d; --shadow: 0 1px 2px rgba(27, 27, 25, .05), 0 6px 20px rgba(27, 27, 25, .05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111110; --surface: #1b1b1a; --surface-2: #272725; --text: #f1f0ec; --muted: #9b9990; --faint: #67655e;
      --line: rgba(241, 240, 236, .1); --accent: #2dd4bf; --accent-soft: rgba(45, 212, 191, .14); --on-accent: #06201d;
      --bad: #ff6b5e; --good: #4ade80; --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body {
    margin: 0; color: var(--text); background: var(--bg);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    padding: env(safe-area-inset-top) 0 calc(88px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 640px; margin: 0 auto; padding: 0 16px; }
  .num { font-variant-numeric: tabular-nums; }
  h1 { font-size: 30px; line-height: 1.15; letter-spacing: -.02em; margin: 22px 0 14px; font-weight: 700; }
  h2 { font-size: 13px; font-weight: 600; letter-spacing: .02em; color: var(--muted); margin: 22px 4px 8px; display: flex; justify-content: space-between; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }
  .bad { color: var(--bad); }
  .good { color: var(--good); }

  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  .btn { white-space: nowrap; flex: none; background: var(--accent); color: var(--on-accent); font-weight: 600; padding: 12px 18px; border-radius: 14px; }
  .btn:active { opacity: .85; }
  .btn:disabled { opacity: .45; }
  input[type=text], input[type=password], input[type=date] {
    font: inherit; color: var(--text); width: 100%; padding: 13px 14px; border-radius: 14px; border: 1px solid var(--line);
    background: var(--surface); outline: none; min-width: 0;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  /* tab bar */
  nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: center;
    padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border-top: 1px solid var(--line);
  }
  nav .inner { display: flex; width: 100%; max-width: 640px; }
  nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; font-size: 11px; font-weight: 600; color: var(--faint); }
  nav button.on { color: var(--accent); }
  nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* cards */
  .card { background: var(--surface); border-radius: 18px; padding: 16px; margin: 0 0 10px; box-shadow: var(--shadow); border: 1px solid var(--line); }
  .card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .card .merchant { font-weight: 650; font-size: 17px; overflow-wrap: anywhere; }
  .card .total { font-weight: 700; font-size: 18px; white-space: nowrap; }
  .card .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .items { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); display: grid; gap: 4px; }
  .item { display: flex; justify-content: space-between; gap: 14px; font-size: 14px; color: var(--muted); }
  .item span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .more { color: var(--accent); font-size: 13px; font-weight: 600; margin-top: 4px; text-align: left; }
  .photo { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; color: var(--accent); font-size: 14px; font-weight: 600; }
  .day { display: flex; justify-content: space-between; align-items: baseline; margin: 20px 4px 8px; }
  .day b { font-size: 15px; }
  .day span { color: var(--muted); font-size: 13px; }

  /* upload */
  .pick {
    display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 38px 16px; border-radius: 22px;
    background: var(--surface); border: 1.5px dashed var(--faint); text-align: center; cursor: pointer;
  }
  .pick:active { background: var(--surface-2); }
  .pick .ic { width: 54px; height: 54px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
  .pick svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .pick strong { font-size: 18px; }
  input[type=file] { display: none; }
  .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); display: inline-block; animation: sp .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .datefix { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .datefix label { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .datefix input { padding: 8px 10px; }

  /* chat */
  body.chatting { padding-bottom: calc(150px + env(safe-area-inset-bottom)); }
  .chatbar {
    position: fixed; left: 0; right: 0; bottom: calc(64px + env(safe-area-inset-bottom)); z-index: 9; padding: 8px 16px;
    background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  }
  .chatbar .inner { display: flex; gap: 8px; max-width: 640px; margin: 0 auto; }
  .chatbar .new { flex: none; width: 46px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); display: grid; place-items: center; }
  .chatbar .new svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #chatLog { display: grid; gap: 14px; }
  .bubble { padding: 11px 14px; border-radius: 18px; max-width: 88%; overflow-wrap: anywhere; white-space: pre-wrap; }
  .bubble.me { justify-self: end; background: var(--accent-soft); border-bottom-right-radius: 6px; }
  .bubble.ai { background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; box-shadow: var(--shadow); }
  .scope { margin: 6px 4px 0; font-size: 12px; color: var(--faint); }
  .reply { display: grid; gap: 10px; }
  .reply .card { margin: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .chip { padding: 8px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  .hint { margin: 14px 4px; font-size: 13px; color: var(--muted); }

  /* browse */
  .months { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 10px; scrollbar-width: none; }
  .months::-webkit-scrollbar { display: none; }
  .months button { flex: none; padding: 9px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; font-weight: 600; color: var(--muted); }
  .months button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .months small { opacity: .7; font-weight: 500; margin-left: 4px; }
  .summary { display: flex; justify-content: space-between; align-items: baseline; margin: 4px 4px 10px; }
  .summary b { font-size: 20px; }
  .cal { background: var(--surface); border-radius: 18px; padding: 12px; border: 1px solid var(--line); box-shadow: var(--shadow); margin-bottom: 6px; }
  .cal .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .cal .wd { font-size: 11px; color: var(--faint); padding: 4px 0; }
  .cal button { aspect-ratio: 1; border-radius: 12px; font-size: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--faint); }
  .cal button.has { color: var(--text); font-weight: 600; }
  .cal button.has::after { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
  .cal button.sel { background: var(--accent); color: var(--on-accent); }
  .cal button.sel::after { background: var(--on-accent); }
  .cal button.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .tools { display: flex; gap: 8px; align-items: center; margin: 0 0 6px; }
  .tools .pill { display: flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; font-weight: 600; }
  .tools .pill.on { color: var(--accent); }
  .tools input[type=date] { padding: 8px 12px; width: auto; flex: 1; border-radius: 999px; font-size: 14px; }
  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }

  /* lightbox */
  #lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .92); display: grid; place-items: center; padding: 16px; overflow: auto; }
  #lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
  #lightbox button { position: fixed; top: calc(12px + env(safe-area-inset-top)); right: 14px; width: 38px; height: 38px; border-radius: 50%; background: rgba(255, 255, 255, .18); color: #fff; font-size: 20px; }

  /* login */
  .login { padding-top: 14vh; text-align: center; }
  .login .logo { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 18px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
  .login svg { width: 34px; height: 34px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .login .row { display: flex; gap: 8px; margin-top: 18px; }
</style>
</head>
<body>
<main>
  <section id="login" class="login hidden">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></div>
    <h1>小票</h1>
    <p class="muted">第一次使用，请输入口令。<br>之后这台设备会记住。</p>
    <div class="row">
      <input id="pass" type="password" placeholder="口令" autocomplete="current-password">
      <button class="btn" id="enter">进入</button>
    </div>
    <p id="loginError" class="bad"></p>
  </section>

  <section id="app" class="hidden">
    <h1 id="title">上传</h1>

    <div id="paneUpload">
      <label class="pick" for="file">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
        <strong>拍照或选择照片</strong>
        <span class="muted">可以一次选多张，自动识别日期、商家和商品</span>
      </label>
      <input id="file" type="file" accept="image/*" multiple>
      <div id="uploads" style="margin-top:16px"></div>
      <p class="hint">上传的小票会在下次打开 Mac 上的 AutoReceipt 时，归入 Receipt 文件夹。</p>
    </div>

    <div id="paneChat" class="hidden">
      <div id="chatEmpty">
        <p class="hint">问问你的小票：某次买了什么、去某类店几次、某段时间花了多少。只回答和小票有关的问题。</p>
        <div id="historyBox">
          <p class="hint" id="historyLabel">最近问过</p>
          <div id="history" class="chips"></div>
        </div>
      </div>
      <div id="chatLog"></div>
    </div>

    <div id="paneBrowse" class="hidden">
      <div id="months" class="months"></div>
      <div class="tools">
        <button class="pill" id="calToggle">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          日历
        </button>
        <input id="jump" type="date" aria-label="跳到日期">
      </div>
      <div id="cal" class="cal hidden"></div>
      <div id="browseSummary" class="summary"></div>
      <div id="browseList"></div>
    </div>
  </section>
</main>

<div id="chatbar" class="chatbar hidden">
  <div class="inner">
    <button class="new hidden" id="newChat" aria-label="新对话"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg></button>
    <input id="q" type="text" placeholder="问问你的小票" enterkeyhint="send" autocomplete="off">
    <button class="btn" id="go">发送</button>
  </div>
</div>

<nav id="tabs" class="hidden">
  <div class="inner">
    <button data-tab="upload" class="on"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg>上传</button>
    <button data-tab="chat"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>对话</button>
    <button data-tab="browse"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>浏览</button>
  </div>
</nav>

<div id="lightbox" class="hidden"><img alt=""><button aria-label="关闭">✕</button></div>

<script>
// Your Supabase project's function URL.
const API = "https://orvuihiojdplciilktvm.supabase.co/functions/v1/api";

const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
let passcode = store.get("passcode") || "";

async function call(body) {
  let res;
  try {
    res = await fetch(API, { method: "POST", headers: { "content-type": "application/json", "x-passcode": passcode }, body: JSON.stringify(body) });
  } catch { throw new Error("网络不通，请稍后再试"); }
  const json = await res.json().catch(() => ({}));
  if (res.status === 401) { store.del("passcode"); passcode = ""; show(); throw new Error(json.error || "口令不对"); }
  if (!res.ok) throw new Error(json.error || `出错了（${res.status}）`);
  return json;
}

const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k.startsWith("on")) n[k] = v; else n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) n.append(k);
  return n;
};
const fmt = new Intl.NumberFormat("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const SYM = { USD: "$", CNY: "¥", RMB: "¥", EUR: "€", GBP: "£" };
const money = (n, cur) => (SYM[(cur || "USD").toUpperCase()] ?? cur + " ") + fmt.format(n);
const moneyOf = (r) => (Number(r.total) > 0 ? money(Number(r.total), r.currency) : "");
const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const WD = ["日", "一", "二", "三", "四", "五", "六"];
function dayTitle(date) {
  const [y, m, d] = date.split("-").map(Number);
  const w = WD[new Date(y, m - 1, d).getDay()];
  return `${y === new Date().getFullYear() ? "" : y + "年"}${m}月${d}日 周${w}`;
}
const monthTitle = (m) => `${m.slice(0, 4)}年${Number(m.slice(5))}月`;

/* ---------- shell ---------- */
function show() {
  $("login").classList.toggle("hidden", !!passcode);
  $("app").classList.toggle("hidden", !passcode);
  $("tabs").classList.toggle("hidden", !passcode);
  if (!passcode) $("chatbar").classList.add("hidden");
}
$("enter").onclick = async () => {
  passcode = $("pass").value.trim();
  $("loginError").textContent = "";
  if (!passcode) return;
  try { await call({ action: "ping" }); store.set("passcode", passcode); show(); }
  catch (e) { $("loginError").textContent = e.message; passcode = ""; }
};
$("pass").addEventListener("keydown", (e) => { if (e.key === "Enter") $("enter").click(); });

const TITLES = { upload: "上传", chat: "对话", browse: "浏览" };
function tab(name) {
  if (!TITLES[name]) name = "upload";
  for (const n of ["upload", "chat", "browse"]) $("pane" + n[0].toUpperCase() + n.slice(1)).classList.toggle("hidden", n !== name);
  $("chatbar").classList.toggle("hidden", name !== "chat");
  document.body.classList.toggle("chatting", name === "chat");
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === name));
  $("title").textContent = TITLES[name];
  store.set("tab", name);
  if (name === "browse") openBrowse();
  scrollTo(0, 0);
}
document.querySelectorAll("nav button").forEach((b) => (b.onclick = () => tab(b.dataset.tab)));

function lightbox(src) {
  $("lightbox").querySelector("img").src = src;
  $("lightbox").classList.remove("hidden");
}
$("lightbox").onclick = () => $("lightbox").classList.add("hidden");

/* ---------- receipt cards ---------- */
function itemsBlock(r) {
  if (!r.items?.length) return null;
  const SHOW = 5;
  const box = el("div", { class: "items" });
  const draw = (all) => {
    box.replaceChildren(...(all ? r.items : r.items.slice(0, SHOW)).map((i) => el("div", { class: "item" },
      el("span", {}, Number(i.quantity) > 1 ? `${i.name} ×${Number(i.quantity)}` : i.name),
      el("span", { class: "num" }, Number(i.price) > 0 ? money(Number(i.price), r.currency) : ""))));
    if (!all && r.items.length > SHOW) box.append(el("button", { class: "more", onclick: () => draw(true) }, `另外 ${r.items.length - SHOW} 项…`));
  };
  draw(false);
  return box;
}
function card(r, { withDate = false } = {}) {
  return el("div", { class: "card" },
    el("div", { class: "top" },
      el("div", {},
        el("div", { class: "merchant" }, r.merchant || "未识别商家"),
        withDate ? el("div", { class: "sub" }, dayTitle(r.date)) : null),
      el("div", { class: "total num" }, moneyOf(r))),
    itemsBlock(r),
    r.view_url ? el("button", { class: "photo", onclick: () => lightbox(r.view_url) }, "查看小票照片 ›") : null);
}
function groupByDay(list) {
  const out = [];
  for (const r of list) {
    const last = out[out.length - 1];
    if (last && last.date === r.date) last.rows.push(r); else out.push({ date: r.date, rows: [r] });
  }
  return out;
}
function dayGroups(list, withHeader = true) {
  return groupByDay(list).flatMap((g) => [
    withHeader ? el("div", { class: "day" }, el("b", {}, dayTitle(g.date))) : null,
    ...g.rows.map((r) => card(r)),
  ]).filter(Boolean);
}

/* ---------- upload ---------- */
// Downscale to the same 2576px JPEG the Mac app sends, so reading quality matches.
async function prepare(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
  const scale = Math.min(1, 2576 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85));
  const buf = new Uint8Array(await blob.arrayBuffer());
  let bin = ""; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode(...buf.subarray(i, i + 0x8000));
  return btoa(bin);
}
$("file").onchange = async (e) => {
  const files = [...e.target.files]; e.target.value = "";
  for (const f of files) {
    const box = el("div", { class: "card" }, el("span", { class: "muted" }, el("span", { class: "spin" }), "识别中…"));
    $("uploads").prepend(box);
    try {
      const image = await prepare(f);
      const r = await call({ action: "upload", image, fallbackDate: ymd(new Date(f.lastModified || Date.now())) });
      box.replaceChildren(...renderUpload(r));
      months = null; // browse needs a refresh
    } catch (err) {
      box.replaceChildren(el("span", { class: "bad" }, err.message));
    }
  }
};
function renderUpload(r) {
  if (!r.ok) return [el("div", { class: "merchant" }, "没有识别到小票"), el("div", { class: "sub" }, r.note || "")];
  const names = r.receipts.map((x) => x.merchant).filter(Boolean).join("、") || "小票";
  const date = el("input", { type: "date", value: r.date });
  date.onchange = async () => {
    try { await call({ action: "set_date", file: r.file, date: date.value }); date.style.borderColor = ""; }
    catch (err) { date.style.borderColor = "var(--bad)"; alert(err.message); }
  };
  return [
    el("div", { class: "top" }, el("div", { class: "merchant" }, names), el("div", { class: "good" }, "✓ 已上传")),
    ...r.receipts.map((x) => el("div", { class: "sub num" }, `${x.merchant || ""} ${moneyOf(x)} · ${x.items.length} 项`)),
    el("div", { class: "datefix" }, el("label", {}, r.dateFromPhoto ? "日期（来自小票）" : "日期（按拍摄时间）"), date),
  ];
}

/* ---------- chat ---------- */
let turns = [], asking = false;
const SHOWN = 5;
const loadHistory = () => { try { return JSON.parse(store.get("history") || "[]"); } catch { return []; } };
function remember(q) {
  store.set("history", JSON.stringify([q, ...loadHistory().filter((h) => h !== q)].slice(0, 10)));
  drawHistory();
}
function drawHistory() {
  const list = loadHistory();
  $("historyBox").classList.toggle("hidden", !list.length);
  $("history").replaceChildren(...list.map((h) => el("button", { class: "chip", onclick: () => ask(h) }, h)));
}
const toEnd = () => scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });

function replyBlock(r) {
  const box = el("div", { class: "reply" }, el("div", { class: "bubble ai" }, r.answer));
  if (r.scope) box.append(el("div", { class: "scope" }, r.scope));
  const list = r.results || [];
  const draw = (all) => {
    box.querySelectorAll(".card, .more").forEach((n) => n.remove());
    for (const x of all ? list : list.slice(0, SHOWN)) box.append(card(x, { withDate: true }));
    if (!all && list.length > SHOWN) box.append(el("button", { class: "more", onclick: () => draw(true) }, `显示全部 ${list.length} 张`));
  };
  draw(false);
  return box;
}

async function ask(text) {
  const q = (text ?? $("q").value).trim();
  if (!q || asking) return;
  asking = true; $("go").disabled = true; $("q").value = "";
  $("chatEmpty").classList.add("hidden"); $("newChat").classList.remove("hidden");
  $("chatLog").append(el("div", { class: "bubble me" }, q));
  const wait = el("div", { class: "bubble ai muted" }, el("span", { class: "spin" }), "正在翻小票…");
  $("chatLog").append(wait); toEnd();
  try {
    const r = await call({ action: "chat", q, history: turns });
    wait.replaceWith(replyBlock(r));
    turns = [...turns, { q, a: r.answer }].slice(-6);
    if (r.onTopic) remember(q);
  } catch (err) {
    wait.className = "bubble ai bad"; wait.replaceChildren(err.message);
  } finally { asking = false; $("go").disabled = false; toEnd(); }
}
function newChat() {
  if (asking) return;
  turns = []; $("chatLog").replaceChildren();
  $("chatEmpty").classList.remove("hidden"); $("newChat").classList.add("hidden");
}
$("go").onclick = () => ask();
$("newChat").onclick = newChat;
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) ask(); });
drawHistory();

/* ---------- browse ---------- */
let months = null, cache = {}, selMonth = null, selDay = null, calOpen = false;

async function openBrowse() {
  if (!months) {
    $("browseList").replaceChildren(el("div", { class: "empty" }, el("span", { class: "spin" }), "加载中…"));
    try {
      months = (await call({ action: "months" })).months; cache = {};
    } catch (err) { $("browseList").replaceChildren(el("p", { class: "bad" }, err.message)); return; }
  }
  if (!months.length) { $("browseList").replaceChildren(el("div", { class: "empty" }, "还没有小票")); $("months").replaceChildren(); return; }
  if (!selMonth || !months.some((m) => m.month === selMonth)) selMonth = months[0].month;
  await pickMonth(selMonth, selDay);
}

async function pickMonth(m, day = null) {
  selMonth = m; selDay = day;
  drawMonths(); drawCalendar();
  if (!cache[m]) {
    $("browseList").replaceChildren(el("div", { class: "empty" }, el("span", { class: "spin" }), "加载中…"));
    try { cache[m] = (await call({ action: "list", month: m })).results; }
    catch (err) { $("browseList").replaceChildren(el("p", { class: "bad" }, err.message)); return; }
  }
  drawList(); drawCalendar();
}

function drawMonths() {
  const bar = $("months");
  bar.replaceChildren(...months.map((m) => el("button", { class: m.month === selMonth ? "on" : "", onclick: () => pickMonth(m.month) },
    monthTitle(m.month), el("small", { class: "num" }, String(m.count)))));
  bar.querySelector(".on")?.scrollIntoView({ inline: "center", block: "nearest" });
}

function drawList() {
  const all = cache[selMonth] || [];
  const list = selDay ? all.filter((r) => r.date === selDay) : all;
  $("browseSummary").replaceChildren(
    el("b", {}, selDay ? dayTitle(selDay) : monthTitle(selMonth)),
    el("span", { class: "muted num" }, `${list.length} 张`),
  );
  if (selDay) $("browseSummary").append(el("button", { class: "more", onclick: () => pickMonth(selMonth) }, "整月"));
  $("browseList").replaceChildren(...(list.length ? dayGroups(list, !selDay) : [el("div", { class: "empty" }, "这一天没有小票")]));
}

function drawCalendar() {
  $("calToggle").classList.toggle("on", calOpen);
  $("cal").classList.toggle("hidden", !calOpen);
  if (!calOpen) return;
  const [y, m] = selMonth.split("-").map(Number);
  const first = new Date(y, m - 1, 1).getDay();
  const count = new Date(y, m, 0).getDate();
  const has = new Set((cache[selMonth] || []).map((r) => Number(r.date.slice(8))));
  const today = ymd(new Date());
  const cells = WD.map((w) => el("div", { class: "wd" }, w));
  for (let i = 0; i < first; i++) cells.push(el("div"));
  for (let d = 1; d <= count; d++) {
    const key = `${selMonth}-${String(d).padStart(2, "0")}`;
    cells.push(el("button", {
      class: [has.has(d) ? "has" : "", key === selDay ? "sel" : "", key === today ? "today" : ""].join(" "),
      onclick: () => pickMonth(selMonth, key),
    }, String(d)));
  }
  $("cal").replaceChildren(el("div", { class: "grid" }, ...cells));
}

$("calToggle").onclick = () => { calOpen = !calOpen; drawCalendar(); };
$("jump").onchange = async (e) => {
  const v = e.target.value; if (!v) return;
  calOpen = true;
  if (!months.some((m) => m.month === v.slice(0, 7))) {
    months = [...months, { month: v.slice(0, 7), count: 0 }].sort((a, b) => b.month.localeCompare(a.month));
  }
  await pickMonth(v.slice(0, 7), v);
  e.target.value = "";
};

show();
if (passcode) tab(store.get("tab") || "upload");
</script>
