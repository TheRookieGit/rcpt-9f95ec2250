<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小票">
<meta name="robots" content="noindex">
<title>小票</title>
<style>
  :root {
    --bg: #f5f5f7; --card: #fff; --text: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7;
    --accent: #0071e3; --accent-text: #fff; --bad: #d70015; --good: #1d8a3a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --card: #1c1c1e; --text: #f5f5f7; --muted: #98989d; --line: #38383a; --accent: #0a84ff; --bad: #ff453a; --good: #32d74b; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px);
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 20px 0 12px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tabs button { flex: 1; }
  button, .btn {
    appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--text);
    font: inherit; padding: 12px 16px; border-radius: 12px; cursor: pointer; text-align: center;
  }
  button.primary, .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.active { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; }
  input[type=text], input[type=password], input[type=date] {
    font: inherit; width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--text);
  }
  .row { display: flex; gap: 8px; }
  .row > input { flex: 1; }
  .card { background: var(--card); border-radius: 14px; padding: 14px; margin: 10px 0; }
  .card h3 { margin: 0; font-size: 17px; display: flex; justify-content: space-between; gap: 8px; }
  .muted { color: var(--muted); font-size: 14px; }
  .bad { color: var(--bad); }
  .good { color: var(--good); }
  .item { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--muted); }
  .item span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hidden { display: none !important; }
  #drop { display: block; padding: 28px 16px; border: 2px dashed var(--line); border-radius: 16px; text-align: center; color: var(--muted); }
  #drop strong { display: block; color: var(--text); font-size: 18px; margin-bottom: 4px; }
  input[type=file] { display: none; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <section id="login" class="hidden">
    <h1>小票</h1>
    <p class="muted">第一次使用，请输入口令。之后这台设备会记住。</p>
    <div class="row">
      <input id="pass" type="password" placeholder="口令" autocomplete="current-password">
      <button class="primary" id="enter">进入</button>
    </div>
    <p id="loginError" class="bad"></p>
  </section>

  <section id="app" class="hidden">
    <h1>小票</h1>
    <div class="tabs">
      <button id="tabUpload" class="active">上传</button>
      <button id="tabSearch">搜索</button>
    </div>

    <div id="paneUpload">
      <label id="drop" for="file"><strong>拍照或选择照片</strong>可以一次选多张</label>
      <input id="file" type="file" accept="image/*" multiple>
      <div id="uploads"></div>
      <p class="muted">上传后会自动识别。下次打开 Mac 上的 AutoReceipt，它们会被归入 Receipt 文件夹。</p>
    </div>

    <div id="paneSearch" class="hidden">
      <div class="row">
        <input id="q" type="text" placeholder="上次去 Whole Foods 买了什么" enterkeyhint="search">
        <button class="primary" id="go">搜索</button>
      </div>
      <p id="searchStatus" class="muted"></p>
      <div id="results"></div>
    </div>
  </section>
</main>

<script>
// Set this to your Supabase project's function URL: https://<project-ref>.supabase.co/functions/v1/api
const API = "https://orvuihiojdplciilktvm.supabase.co/functions/v1/api";

const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
let passcode = store.get("passcode") || "";

async function call(body) {
  let res;
  try {
    res = await fetch(API, { method: "POST", headers: { "content-type": "application/json", "x-passcode": passcode }, body: JSON.stringify(body) });
  } catch {
    throw new Error("网络不通，请稍后再试");
  }
  const json = await res.json().catch(() => ({}));
  if (res.status === 401) { store.del("passcode"); passcode = ""; show(); throw new Error(json.error || "口令不对"); }
  if (!res.ok) throw new Error(json.error || `出错了（${res.status}）`);
  return json;
}

function show() {
  $("login").classList.toggle("hidden", !!passcode);
  $("app").classList.toggle("hidden", !passcode);
}

$("enter").onclick = async () => {
  passcode = $("pass").value.trim();
  $("loginError").textContent = "";
  if (!passcode) return;
  try {
    await call({ action: "ping" });
    store.set("passcode", passcode);
    show();
  } catch (e) {
    $("loginError").textContent = e.message;
    passcode = "";
  }
};
$("pass").addEventListener("keydown", (e) => { if (e.key === "Enter") $("enter").click(); });

function tab(name) {
  $("paneUpload").classList.toggle("hidden", name !== "upload");
  $("paneSearch").classList.toggle("hidden", name !== "search");
  $("tabUpload").classList.toggle("active", name === "upload");
  $("tabSearch").classList.toggle("active", name === "search");
}
$("tabUpload").onclick = () => tab("upload");
$("tabSearch").onclick = () => tab("search");

const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? (n.className = v) : k.startsWith("on") ? (n[k] = v) : n.setAttribute(k, v);
  for (const k of kids.flat()) if (k != null) n.append(k);
  return n;
};
const money = (r) => (r.total > 0 ? (r.currency === "CNY" ? "¥" : "$") + Number(r.total).toFixed(2) : "");
const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

// Downscale to the same 2576px JPEG the Mac app sends, so reading quality matches.
async function prepare(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
  const scale = Math.min(1, 2576 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85));
  const buf = new Uint8Array(await blob.arrayBuffer());
  let bin = ""; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode(...buf.subarray(i, i + 0x8000));
  return btoa(bin);
}

$("file").onchange = async (e) => {
  const files = [...e.target.files]; e.target.value = "";
  for (const f of files) {
    const status = el("span", { class: "muted" }, "识别中…");
    const card = el("div", { class: "card" }, el("h3", {}, f.name || "照片"), status);
    $("uploads").prepend(card);
    try {
      const image = await prepare(f);
      const r = await call({ action: "upload", image, fallbackDate: ymd(new Date(f.lastModified || Date.now())) });
      card.replaceChildren(...renderUpload(r));
    } catch (err) {
      card.replaceChildren(el("h3", {}, f.name || "照片"), el("span", { class: "bad" }, err.message));
    }
  }
};

function renderUpload(r) {
  if (!r.ok) return [el("h3", {}, "没有识别到小票"), el("span", { class: "muted" }, r.note || "")];
  const out = [el("h3", {}, el("span", {}, r.receipts.map((x) => x.merchant).filter(Boolean).join("、") || "小票"), el("span", { class: "good" }, "已上传"))];
  const date = el("input", { type: "date", value: r.date });
  date.onchange = async () => {
    try { await call({ action: "set_date", file: r.file, date: date.value }); date.style.borderColor = ""; }
    catch (err) { date.style.borderColor = "var(--bad)"; alert(err.message); }
  };
  out.push(el("div", { class: "muted" }, r.dateFromPhoto ? "日期（来自小票，可修改）" : "图中没认出日期，按拍摄日期，可修改"), date);
  for (const x of r.receipts) {
    out.push(el("div", { class: "muted" }, `${x.merchant || ""} ${money(x)} · ${x.items.length} 项`));
  }
  return out;
}

async function search() {
  const q = $("q").value.trim();
  if (!q) return;
  $("go").disabled = true; $("searchStatus").textContent = "搜索中…"; $("results").replaceChildren();
  try {
    const { query, results } = await call({ action: "search", q });
    const bits = [];
    if (query.merchants.length) bits.push("商家：" + query.merchants.join(" / "));
    if (query.items.length) bits.push("商品：" + query.items.join(" / "));
    if (query.dateFrom || query.dateTo) bits.push(`日期：${query.dateFrom || "…"} ~ ${query.dateTo || "…"}`);
    $("searchStatus").textContent = `${results.length} 张小票` + (bits.length ? " · " + bits.join(" · ") : "");
    $("results").replaceChildren(...results.map((r) => {
      const [, m, d] = r.date.split("-");
      const items = r.items.slice(0, 15).map((i) => el("div", { class: "item" },
        el("span", {}, i.quantity > 1 ? `${i.name} ×${i.quantity}` : i.name), el("span", {}, i.price > 0 ? Number(i.price).toFixed(2) : "")));
      return el("div", { class: "card" },
        el("h3", {}, el("span", {}, `${r.date.slice(0, 4)}年${+m}月${+d}日 ${r.merchant}`), el("span", {}, money(r))),
        ...items,
        r.items.length > 15 ? el("div", { class: "muted" }, `…另有 ${r.items.length - 15} 项`) : null,
        r.view_url ? el("a", { href: r.view_url, target: "_blank", rel: "noopener" }, "查看小票照片") : null);
    }));
  } catch (err) {
    $("searchStatus").textContent = ""; $("results").replaceChildren(el("p", { class: "bad" }, err.message));
  } finally { $("go").disabled = false; }
}
$("go").onclick = search;
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter") search(); });

show();
</script>
</body>
</html>
